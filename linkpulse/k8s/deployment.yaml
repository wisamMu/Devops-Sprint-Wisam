apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkpulse
  labels:
    app: linkpulse
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: linkpulse
  template:
    metadata:
      labels:
        app: linkpulse
    spec:
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7777
          readinessProbe:
            httpGet:
              path: /health.html
              port: 7777
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health.html
              port: 7777
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
