name: end-to-end hello-web

on:
  pull_request:
    branches: [labs]
    paths:
      - 'end-to-end/**'
      - '.github/workflows/end-to-end.yml'
  push:
    branches: [labs]
    paths:
      - 'end-to-end/**'
      - '.github/workflows/end-to-end.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  APP_DIR: end-to-end/hello-web
  K8S_DIR: end-to-end/k8s

jobs:
  ci:
    name: hello-web CI (build, test, scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t "hello-web:${GITHUB_SHA}" "$APP_DIR"

      - name: Test - run it and check the pages
        run: |
          docker run -d --name hello -p 8080:8080 "hello-web:${GITHUB_SHA}"
          for _ in $(seq 1 15); do curl -fsS localhost:8080/health.html >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/health.html | grep -qx ok
          curl -fsS localhost:8080/ | grep -q '<h1>'
          echo "health and page OK"
          docker rm -f hello

      - name: Scan with Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "hello-web:${GITHUB_SHA}"

  deploy:
    name: deploy to k3s on EC2 (OIDC + SSM)
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/labs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-hello-web
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Get AWS credentials with OIDC (no keys)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.HELLO_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push hello-web:<git-sha>
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/hello-web:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" "$APP_DIR"
          docker push "$IMAGE"

      - name: Find the running hello-web instance
        id: ec2
        run: |
          ID=$(aws ec2 describe-instances \
            --filters Name=tag:App,Values=hello-web Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No running hello-web instance (is it paused?). Start it, then re-run this workflow."
            exit 1
          fi
          echo "instance: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Kubernetes (k3s) and health-check via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/hello-web:${{ github.sha }}
          INSTANCE_ID: ${{ steps.ec2.outputs.id }}
        run: |
          MANIFESTS=$( { sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" "$K8S_DIR/deployment.yaml"; echo '---'; cat "$K8S_DIR/service.yaml"; } | base64 -w0)
          PARAMS=$(jq -nc --arg reg "$REGISTRY" --arg img "$IMAGE" --arg m "$MANIFESTS" '{commands: [
            "set -e",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "kubectl create secret docker-registry ecr-pull --docker-server=\($reg) --docker-username=AWS --docker-password=\"$(aws ecr get-login-password --region us-east-1)\" --dry-run=client -o yaml | kubectl apply -f -",
            "echo \($m) | base64 -d > /tmp/hello-web.yaml",
            "kubectl apply -f /tmp/hello-web.yaml",
            "kubectl annotate deployment/hello-web kubernetes.io/change-cause=\"deploy \($img)\" --overwrite",
            "if ! kubectl rollout status deployment/hello-web --timeout=120s; then echo \"rollout FAILED - rolling back\"; kubectl rollout undo deployment/hello-web; kubectl rollout status deployment/hello-web --timeout=120s; exit 1; fi",
            "kubectl get pods -l app=hello-web -o wide",
            "for i in $(seq 1 15); do if curl -fsS localhost/health.html; then echo \"healthy: \($img)\"; exit 0; fi; sleep 2; done",
            "echo \"health check FAILED\"; kubectl describe deployment hello-web | tail -20; exit 1"
          ]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "k8s deploy hello-web ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          # wait up to 5 min (the built-in "ssm wait" gives up after 100 s, shorter than a k8s rollout)
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Kubernetes deploy or health check failed on $INSTANCE_ID (status: $STATUS)"
            exit 1
          fi
